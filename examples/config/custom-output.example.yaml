version: 1.0.0
shell:
    auto_detect: true
    type: ""

# Custom output configuration - Generate to .zshrc-test in home directory
output:
    directory: "~"           # Home directory
    filename: ".zshrc-test"  # Custom filename (will create ~/.zshrc-test)

modules:
    enabled:
        - git-shortcuts
        - docker-basics
        - productivity-tools
    registries:
        - https://github.com/example/shellify-registry.git

generation:
    verbose: true
    backup_existing: true    # Will backup existing .zshrc-test before overwriting
    integration_mode: source

# This configuration will generate a shell script at ~/.zshrc-test
# You can then source it from your main .zshrc with:
#   source ~/.zshrc-test